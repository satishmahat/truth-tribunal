<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analyzer - BiGRU-CNN</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f7f7f7; 
        }
        .container { 
            max-width: 400px; 
            margin: 60px auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
        }
        textarea { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0 20px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-family: inherit; 
            font-size: 15px; 
            resize: vertical;
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
        }
        button:hover { 
            background: #0056b3; 
        }
        .result { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 18px; 
        }
        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }
        .error {
            color: #721c24;
            background: #f8d7da;
            padding: 10px;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎭 Sentiment Analyzer</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">BiGRU-CNN Model</p>

        <textarea 
            id="textInput" 
            rows="6" 
            placeholder="Enter text to analyze sentiment..."
            maxlength="1000"
        ></textarea>
        
        <button id="analyzeBtn" onclick="analyzeSentiment()">
            🔍 Analyze Sentiment
        </button>

        <div class="loading" id="loading">
            <p>Analyzing sentiment...</p>
        </div>

        <div class="result" id="resultSection"></div>
    </div>

    <script>
        async function analyzeSentiment() {
            const textInput = document.getElementById('textInput');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');
            
            const text = textInput.value.trim();
            
            if (!text) {
                alert('Please enter some text to analyze.');
                return;
            }

            // Show loading state
            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            resultSection.innerHTML = '';

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text })
                });

                const result = await response.json();

                if (result.error) {
                    resultSection.innerHTML = `<div class="error"><strong>Error:</strong> ${result.error}</div>`;
                } else {
                    resultSection.innerHTML = `
                        <strong>Prediction:</strong> ${result.sentiment}<br>
                        <small>Confidence: ${result.confidence}%</small>
                    `;
                }
            } catch (error) {
                resultSection.innerHTML = '<div class="error"><strong>Error:</strong> Failed to connect to the server.</div>';
            } finally {
                // Hide loading state
                analyzeBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Allow Enter key to trigger analysis
        document.getElementById('textInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                analyzeSentiment();
            }
        });
    </script>
</body>
</html>
